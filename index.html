<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>放置天堂遊戲啟動器</title>

<style>

body{
background:#121212;
color:white;
font-family:sans-serif;
padding:20px;
}

.container{
max-width:420px;
margin:auto;
}

.box{
background:#1e1e1e;
padding:20px;
border-radius:14px;
margin-bottom:16px;
}

h2{
color:#4cd964;
}

h3{
color:#00adb5;
}

input,
select,
button{

width:100%;
padding:12px;
margin-top:8px;
box-sizing:border-box;
border-radius:8px;
border:0;

background:#2c2c2e;
color:white;

}


button{

background:#28a745;
font-weight:bold;

}


.blue{

background:#007aff;

}

.small{

font-size:12px;
color:#888;

}

</style>

</head>


<body>


<div class="container">


<div class="box">


<h2>
🎮 遊戲啟動器
</h2>


<label>
選擇遊戲伺服器
</label>


<select id="gameUrl">


<option value="https://shines871.github.io/idle-lineage-class/">
伺服器二
</option>


<option value="https://pp771007.github.io/idle-lineage-class/">
伺服器一
</option>


<option value="custom">
自訂網址
</option>


</select>



<input
id="customUrl"
placeholder="https://..."
style="display:none;"
>



<button onclick="startGame()">
🚀 啟動遊戲
</button>


</div>





<div class="box">


<h3>
🔌 外掛管理
</h3>



<label>
外掛網址
</label>


<input
id="pluginUrl"
placeholder="https://xxx.user.js"
>



<button
class="blue"
onclick="savePlugin()"
>
保存外掛
</button>




<label>
上傳 JS 外掛
</label>


<input
type="file"
accept=".js"
id="pluginFile"
>




<p class="small">

外掛會在進入遊戲後自動載入，不會在啟動器頁面執行。

</p>



</div>




<div class="box">


<h3>
📌 已保存外掛
</h3>


<div id="pluginList"></div>


</div>




</div>





<script>



const gameSelect =
document.getElementById("gameUrl");



gameSelect.onchange=function(){

if(this.value=="custom"){

document.getElementById("customUrl")
.style.display="block";

}else{

document.getElementById("customUrl")
.style.display="none";

}

};






function startGame(){


let url =
gameSelect.value;



if(url=="custom"){

url =
document.getElementById("customUrl")
.value.trim();

}



if(!url){

alert("請輸入遊戲網址");

return;

}




if(
window.AndroidBridge &&
AndroidBridge.launchGame
){


AndroidBridge.launchGame(url);


}else{


location.href=url;


}



}







function savePlugin(){


let url =
document.getElementById("pluginUrl")
.value.trim();



if(!url){

alert("請輸入外掛網址");

return;

}





if(
window.AndroidBridge &&
AndroidBridge.savePluginUrl
){


AndroidBridge.savePluginUrl(url);


alert(
"✅ 外掛已保存，進入遊戲後自動載入"
);



}else{


alert(
"目前不是 APK 環境"
);


}




document.getElementById("pluginUrl")
.value="";



}







document
.getElementById("pluginFile")
.onchange=function(e){


let file=e.target.files[0];


if(!file){

return;

}



let reader=
new FileReader();



reader.onload=function(){


let blob =
new Blob(
[
reader.result
],
{
type:"text/javascript"
}
);



let url =
URL.createObjectURL(blob);



savePluginObject(url);



};



reader.readAsText(file);



};








function savePluginObject(url){



if(
window.AndroidBridge &&
AndroidBridge.savePluginUrl
){


AndroidBridge.savePluginUrl(url);



alert(
"✅ JS外掛已保存"
);



}



}






</script>


</body>

</html>
