<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>放置天堂 Launcher</title>


<style>

body{

margin:0;
padding:20px;

background:#121212;

color:white;

font-family:
Arial,
"Microsoft JhengHei",
sans-serif;

}


.card{

max-width:420px;

margin:auto;

background:#1e1e1e;

padding:24px;

border-radius:16px;

box-shadow:
0 8px 25px rgba(0,0,0,.5);

}


h2{

text-align:center;

margin-top:0;

}



.sub{

text-align:center;

color:#aaa;

font-size:13px;

margin-bottom:25px;

}



label{

display:block;

margin-top:18px;

margin-bottom:8px;

color:#4cd964;

font-weight:bold;

}



select,
input{

width:100%;

box-sizing:border-box;

padding:12px;

border-radius:8px;

border:

1px solid #444;

background:#2c2c2c;

color:white;

font-size:15px;

}



button{

width:100%;

margin-top:15px;

padding:14px;

border:0;

border-radius:8px;

background:#28a745;

color:white;

font-size:16px;

font-weight:bold;

}



button.secondary{

background:#444;

}



.info{

margin-top:25px;

padding:12px;

border-radius:8px;

background:#252525;

font-size:13px;

color:#ccc;

line-height:1.6;

}


.item{

margin-top:8px;

padding:10px;

background:#303030;

border-radius:6px;

font-size:13px;

word-break:break-all;

}


</style>

</head>



<body>


<div class="card">


<h2>
🎮 放置天堂 Launcher
</h2>


<div class="sub">
Web Game Launcher
</div>



<label>
選擇遊戲伺服器
</label>


<select id="server">


<option value="https://shines871.github.io/idle-lineage-class/">
伺服器二 (shines871)
</option>


<option value="https://pp771007.github.io/idle-lineage-class/">
伺服器一 (pp771007)
</option>


</select>



<button onclick="launchGame()">

🚀 啟動遊戲

</button>





<hr style="margin:25px 0;border-color:#333;">





<label>
外掛網址
</label>


<input id="pluginUrl"
placeholder="輸入自己的 JS 外掛網址">


<button class="secondary"
onclick="addPlugin()">

加入外掛網址

</button>



<div id="pluginList"></div>







<label>
書籤網址
</label>


<input id="bookmarkUrl"
placeholder="輸入書籤網址">


<button class="secondary"
onclick="addBookmark()">

加入書籤

</button>



<div id="bookmarkList"></div>







<label>
上傳外掛檔案
</label>


<input type="file"
id="pluginFile"
accept=".js">



<button class="secondary"
onclick="uploadPlugin()">

上傳外掛

</button>





<div class="info">


注意：


<br>


本 Launcher 不提供任何外掛。


<br>


不內建、不推薦、不販售外掛。


<br>


玩家可自行加入自己的腳本網址或檔案。


</div>



</div>





<script>


let plugins=[];

let bookmarks=[];





function launchGame(){


let url =
document.getElementById("server").value;


location.href=url;


}







function addPlugin(){


let url =
document.getElementById("pluginUrl").value.trim();



if(!url)return;



plugins.push(url);


render();



if(window.AndroidDownloader){

AndroidDownloader.saveSetting(
"plugins",
JSON.stringify(plugins)
);

}


}







function addBookmark(){


let url =
document.getElementById("bookmarkUrl").value.trim();



if(!url)return;



bookmarks.push(url);


render();



if(window.AndroidDownloader){

AndroidDownloader.saveSetting(
"bookmarks",
JSON.stringify(bookmarks)
);

}


}







function uploadPlugin(){


let file =
document.getElementById("pluginFile")
.files[0];



if(!file)return;



let reader=new FileReader();


reader.onload=function(){


plugins.push(reader.result);


render();


};



reader.readAsText(file);


}







function render(){



let p=
document.getElementById("pluginList");


p.innerHTML="";



plugins.forEach(x=>{


p.innerHTML+=
"<div class='item'>插件："+x+"</div>";

});


let b=
document.getElementById("bookmarkList");


b.innerHTML="";



bookmarks.forEach(x=>{


b.innerHTML+=
"<div class='item'>書籤："+x+"</div>";

});


}







</script>



</body>

</html>
